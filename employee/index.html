<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Portal | Kiran K. Shinde & Co.</title><link rel="stylesheet" href="employee.css"></head><body>
<main class="employee-shell"><section id="loginCard" class="card"><p class="eyebrow">KIRAN K. SHINDE &amp; CO.</p><h1>Employee Portal</h1><p>Sign in to view your assigned compliance work.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="Work email" required><input id="loginPassword" type="password" placeholder="Password" required><button>Sign in</button><small>Demo mode: connect Supabase Auth before production use.</small></form></section>
<section id="portalCard" class="card hidden"><div class="portal-head"><div><p class="eyebrow">EMPLOYEE WORKSPACE</p><h1 id="employeeWelcome">Welcome</h1></div><button id="logoutBtn" class="secondary">Log out</button></div><div class="stats"><div><b id="taskCount">0</b><span>Assigned tasks</span></div><div><b>Secure</b><span>Document workspace</span></div></div><h2>My Work</h2><div id="taskList" class="task-list"><p>No tasks assigned yet.</p></div></section></main><script src="employee.js"></script></body></html>
