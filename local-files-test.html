<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Client Files Test</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 18px;color:#172235}form,.box{border:1px solid #dbe3ec;border-radius:12px;padding:18px;margin:14px 0}input,select,button{padding:10px;margin:5px 0;font:inherit}button{background:#142840;color:#fff;border:0;border-radius:7px;cursor:pointer}.file{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f4;padding:9px 0}</style></head><body><h1>Local Client File Test</h1><p>Files save inside <code>storage/clients/&lt;clientId&gt;</code> on this computer only.</p><form id="upload"><input id="clientId" value="CL-001" placeholder="Client ID" required><select id="folder"><option value="received">received</option><option value="working">working</option><option value="ca-review">ca-review</option><option value="final">final</option></select><input id="file" type="file" required><button>Save file locally</button></form><div class="box"><button id="refresh">Show client files</button><div id="files">No files loaded.</div></div><script>const id=()=>document.getElementById('clientId').value.trim();document.getElementById('upload').addEventListener('submit',async e=>{e.preventDefault();const f=document.getElementById('file').files[0];const b=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});const r=await fetch('/api/local-storage/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:id(),folder:document.getElementById('folder').value,fileName:f.name,dataBase64:b})});alert((await r.json()).ok?'Saved locally':'Upload failed')});async function load(){const r=await fetch('/api/local-storage/list?clientId='+encodeURIComponent(id()));const d=await r.json();document.getElementById('files').innerHTML=d.files?.length?d.files.map(f=>`<div class="file"><span>${f.folder}/${f.fileName}</span><a href="/api/local-storage/download?clientId=${encodeURIComponent(id())}&folder=${f.folder}&file=${encodeURIComponent(f.fileName)}">Download</a></div>`).join(''):'No files loaded.'}document.getElementById('refresh').onclick=load;</script></body></html>
