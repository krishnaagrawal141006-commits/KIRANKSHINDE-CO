<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Feedback | Kiran K. Shinde & Co.</title><style>body{margin:0;background:#f4f7fb;color:#10233f;font-family:Arial,sans-serif}.wrap{max-width:700px;margin:auto;padding:28px 18px}.brand{background:#10233f;color:#fff;border-radius:18px;padding:25px;margin-bottom:18px}.brand small{color:#d7ad35;font-weight:700;letter-spacing:1px}.brand h1{margin:10px 0 4px}.brand p{color:#dbe5f2}.card{background:#fff;border:1px solid #dbe4ef;border-radius:18px;padding:24px;box-shadow:0 12px 30px #10233f12}label{display:block;font-weight:700;margin:18px 0 8px}select,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:13px;font:inherit;color:#10233f}textarea{resize:vertical;min-height:120px}.count{font-size:12px;color:#64748b;text-align:right;margin-top:5px}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#d29d22;color:#10233f}.option{border:1px solid #dbe4ef;border-radius:12px;padding:14px;margin:12px 0;background:#fbfdff}.option p{margin:0 0 10px;line-height:1.45}.secondary{background:#10233f;color:#fff}.note{font-size:12px;color:#64748b;margin-top:16px;line-height:1.5}.stars{color:#d29d22;font-size:20px}</style></head><body><main class="wrap"><header class="brand"><small>Kiran K. Shinde & Co.</small><h1>Share your experience</h1><p>Your honest feedback helps our CA team improve.</p></header><section class="card"><div class="stars">★★★★★</div><label for="rating">Your rating</label><select id="rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><label for="feedback">Your feedback</label><textarea id="feedback" maxlength="500" placeholder="Write your actual experience in your own words..."></textarea><div class="count"><span id="count">0</span>/500 characters</div><button id="generate" class="btn primary" style="margin-top:16px">Generate review suggestions</button><div id="result"></div><p class="note">Suggestions use only your feedback. You choose and submit the final review yourself on Google.</p></section></main><script>const params=new URLSearchParams(location.search),reviewUrl=params.get('url')||'https://www.google.com/maps',feedback=document.getElementById('feedback'),count=document.getElementById('count'),result=document.getElementById('result');feedback.addEventListener('input',()=>count.textContent=feedback.value.length);document.getElementById('generate').onclick=async()=>{const text=feedback.value.trim(),rating=document.getElementById('rating').value;if(!text)return alert('Please enter your actual feedback.');result.innerHTML='<p>Creating suggestions…</p>';const r=await fetch('/api/admin/review-drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feedback:text,rating})}),d=await r.json();if(!r.ok){result.innerHTML='<p style="color:#b91c1c">'+(d.error||'Could not generate suggestions.')+'</p>';return}result.innerHTML='<h2 style="margin-top:26px">Choose a suggestion</h2>'+(d.drafts||[]).map(x=>'<div class="option"><p>'+x+'</p><button class="btn secondary continue" data-text="'+encodeURIComponent(x)+'">Continue to Google Review</button></div>').join('');document.querySelectorAll('.continue').forEach(b=>b.onclick=async()=>{const draft=decodeURIComponent(b.dataset.text);try{await navigator.clipboard.writeText(draft)}catch{}window.open(reviewUrl,'_blank','noopener');});};</script></body></html>
