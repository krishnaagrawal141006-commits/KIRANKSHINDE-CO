<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share your feedback | Kiran K. Shinde & Co.</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:680px;margin:50px auto;padding:24px;font-family:Arial,sans-serif"><h1>Share your experience</h1><p>Your honest feedback helps Kiran K. Shinde & Co. improve.</p><label>Rating</label><select id="rating" style="display:block;width:100%;padding:12px;margin:8px 0 18px"><option value="5">★★★★★ 5 stars</option><option value="4">★★★★ 4 stars</option><option value="3">★★★ 3 stars</option><option value="2">★★ 2 stars</option><option value="1">★ 1 star</option></select><label>Your feedback</label><textarea id="feedback" rows="5" placeholder="Tell us about your actual experience..." style="display:block;width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box"></textarea><button id="generate" style="padding:12px 18px;background:#0f172a;color:#fff;border:0;border-radius:8px;cursor:pointer">Generate draft options</button><div id="result" style="margin-top:20px"></div></main><script>const params=new URLSearchParams(location.search);const reviewUrl=params.get('url')||'https://www.google.com/maps';const result=document.getElementById('result');document.getElementById('generate').onclick=async()=>{const feedback=document.getElementById('feedback').value.trim(),rating=document.getElementById('rating').value;if(!feedback)return alert('Please enter your actual feedback.');result.textContent='Creating options…';const r=await fetch('/api/admin/review-drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feedback,rating})});const d=await r.json();if(!r.ok){result.textContent=d.error||'Could not generate drafts.';return}result.innerHTML='<h2>Choose one draft</h2>'+d.drafts.map(x=>`<div style="border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0"><p>${x}</p><button class="copy" data-text="${encodeURIComponent(x)}">Copy & open Google review</button></div>`).join('');document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const text=decodeURIComponent(b.dataset.text);try{await navigator.clipboard.writeText(text)}catch{}window.open(reviewUrl,'_blank','noopener');});};</script></body></html>
