<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share your experience | Kiran K. Shinde & Co.</title><style>body{margin:0;background:#f4f7fb;color:#10233f;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:28px 18px}.brand,.card{background:#fff;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 10px 25px #10233f12}.brand{background:#10233f;color:#fff}.brand small{color:#e0b332;font-weight:bold;letter-spacing:1px}.brand h1{margin:10px 0 4px}.brand p{color:#dbe5f2}.label{display:block;font-weight:bold;margin:18px 0 8px}select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:9px 12px;border:1px solid #cbd5e1;border-radius:18px;background:#fff;cursor:pointer}.tag.active{background:#10233f;color:#fff}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:bold;cursor:pointer;background:#d2a128;color:#10233f}.option{border:1px solid #dbe4ef;border-radius:12px;padding:14px;margin:12px 0}.open{background:#10233f;color:#fff}</style></head><body><main class="wrap"><header class="brand"><small>KIRAN K. SHINDE & CO.</small><h1>Share your experience</h1><p>Your honest experience helps our CA team improve.</p></header><section class="card"><label class="label">Rating</label><select id="rating"><option value="5">★★★★★ 5 stars</option><option value="4">★★★★ 4 stars</option><option value="3">★★★ 3 stars</option><option value="2">★★ 2 stars</option><option value="1">★ 1 star</option></select><label class="label">What best describes your experience?</label><div class="tags" id="tags"></div><label class="label">Anything else? <span style="font-weight:normal;color:#64748b">(optional)</span></label><textarea id="extra" maxlength="300" rows="3" placeholder="Add a short detail if you wish..."></textarea><button class="btn" id="generate" style="margin-top:16px">Generate review options</button><div id="result"></div><p style="font-size:12px;color:#64748b;line-height:1.5">Options use only the facts you select. You choose and submit the final review yourself on Google.</p></section></main><script>const tags=['Professional service','Quick response','Helpful team','Clear tax guidance','Timely filing','Friendly support'];const box=document.getElementById('tags');tags.forEach(t=>{const b=document.createElement('button');b.className='tag';b.type='button';b.textContent=t;b.onclick=()=>b.classList.toggle('active');box.appendChild(b)});const params=new URLSearchParams(location.search),url=params.get('url')||'https://www.google.com/maps';document.getElementById('generate').onclick=async()=>{const selected=[...document.querySelectorAll('.tag.active')].map(x=>x.textContent),extra=document.getElementById('extra').value.trim(),rating=document.getElementById('rating').value;if(!selected.length&&!extra)return alert('Please select at least one experience.');const result=document.getElementById('result');result.innerHTML='<p>Creating options…</p>';const r=await fetch('/api/admin/review-drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating,feedback:selected.join(', ')+(extra?'. '+extra:'')})}),d=await r.json();if(!r.ok){result.innerHTML='<p style="color:#b91c1c">'+(d.error||'Could not generate options.')+'</p>';return}result.innerHTML='<h2>Choose one</h2>'+(d.drafts||[]).map(x=>'<div class="option"><p>'+x+'</p><button class="btn open" data-text="'+encodeURIComponent(x)+'">Copy and open Google Review</button></div>').join('');document.querySelectorAll('[data-text]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(decodeURIComponent(b.dataset.text))}catch{}window.open(url,'_blank','noopener')})};</script></body></html>
