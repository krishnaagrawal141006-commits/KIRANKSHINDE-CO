<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tally Invoice Connection Test</title><style>body{font-family:system-ui;max-width:680px;margin:40px auto;padding:20px;color:#172235}form{display:grid;gap:12px}input,button{padding:12px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}button{background:#142840;color:#fff;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#f1f5f9;padding:14px;border-radius:7px}small{color:#64748b}</style></head><body><h1>Tally Invoice Connection Test</h1><p><small>Dummy invoice test only. TallyPrime must be running with HTTP Server enabled on port 9000.</small></p><form id="invoiceForm"><input id="bridgeToken" type="password" placeholder="Bridge security token" required><input id="customer" placeholder="Customer ledger name" value="Test Customer" required><input id="amount" type="number" min="1" step="0.01" placeholder="Amount" value="1000" required><input id="date" type="date" required><button>Send Test Invoice to Tally</button></form><pre id="result">Ready.</pre><script>const bridge=new URLSearchParams(location.search).get('bridge')||'http://127.0.0.1:9100';document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('invoiceForm').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('result');out.textContent='Sending...';try{const r=await fetch(`${bridge}/create-invoice`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${document.getElementById('bridgeToken').value}`},body:JSON.stringify({customer:document.getElementById('customer').value,amount:document.getElementById('amount').value,date:document.getElementById('date').value})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(err){out.textContent='Bridge not running or blocked: '+err.message}});</script></body></html>
