<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Team | Kiran K. Shinde & Co.</title><link rel="stylesheet" href="styles.css"><style>.team-page{max-width:1180px;margin:auto;padding:48px 20px}.team-page h1{text-align:center;color:#10233f;font-family:Georgia,serif;font-size:44px}.team-page .intro{text-align:center;color:#64748b;max-width:760px;margin:0 auto 36px}.team-group{margin:34px 0}.team-group h2{color:#10233f;border-bottom:2px solid #d2a128;padding-bottom:10px}.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.profile{background:#fff;border:1px solid #dbe4ef;border-radius:16px;padding:18px;box-shadow:0 8px 22px #10233f12}.profile img{width:118px;height:118px;object-fit:cover;border-radius:14px;display:block;margin-bottom:14px}.profile h3{margin:0 0 6px;color:#10233f}.profile .role{font-weight:700;color:#9a7317}.profile .tenure{font-size:.9rem;color:#16835b;margin:7px 0}.profile p{color:#64748b;line-height:1.5;margin:8px 0 0}body{margin:0;background:#f7f9fc;font-family:Arial,sans-serif}.back{display:inline-block;margin:20px;color:#10233f;font-weight:700;text-decoration:none}</style></head><body><a class="back" href="index.html">← Back to website</a><main class="team-page"><h1>Our Team</h1><p class="intro">Meet the professionals and former team members who have contributed to Kiran K. Shinde & Co.'s audit, tax and compliance practice.</p><section class="team-group"><h2>Active Team</h2><div id="active" class="team-grid"></div></section><section class="team-group"><h2>Former Team Members</h2><div id="former" class="team-grid"></div></section></main><script src="team-data.js"></script><script>const desc={Partner:'Chartered Accountant and partner providing professional tax, audit and business advisory services.', 'Admin & Audit Assistant':'Supports audit, accounting, income-tax and GST compliance work.', 'GST & Audit Assistant':'Supports GST compliance, audit and accounting assignments.', 'Accounting & GST Assistant':'Supports accounting, GST compliance and audit documentation.', 'Audit Assistant':'Supports audit, GST compliance, accounting and client requirements.', 'Audit, GST & Accounting Assistant':'Supports audit, GST compliance and accounting assignments.'};const card=e=>`<article class="profile">${e.photo?`<img src="${e.photo}" alt="${e.name}" loading="lazy" decoding="async">`:''}<h3>${e.name}</h3><div class="role">${e.designation}</div><div class="tenure">${e.tenure||''}</div><p>${desc[e.designation]||'Contributed to audit, taxation, accounting and compliance assignments.'}</p></article>`;const team=window.DEFAULT_TEAM||[];document.getElementById('active').innerHTML=team.filter(e=>e.status!=='Former').map(card).join('')||'<p>No active profiles published.</p>';document.getElementById('former').innerHTML=team.filter(e=>e.status==='Former').map(card).join('')||'<p>No former profiles published.</p>';</script></body></html>
<script>{const bios=window.TEAM_BIOS||{};document.querySelectorAll('.profile').forEach(card=>{const name=card.querySelector('h3')?.textContent.trim();if(bios[name]){const p=card.querySelector('p');if(p)p.textContent=bios[name]}})}</script>
<script src="team-data.js?v=3"></script><script>setTimeout(()=>{const bios=window.TEAM_BIOS||{};document.querySelectorAll('.profile').forEach(card=>{const n=card.querySelector('h3')?.textContent.trim(),p=card.querySelector('p');if(bios[n]&&p)p.textContent=bios[n]})},0)</script>
<script>(()=>{try{const edited=JSON.parse(localStorage.getItem('ks_team_profiles')||'null');if(!edited?.length)return;const card=e=>`<article class="profile">${e.photo?`<img src="${e.photo}" alt="${e.name}" loading="lazy" decoding="async">`:''}<div><h3>${e.name||''}</h3><div class="role">${e.designation||''}</div><div class="tenure">${e.tenure||''}</div><p>${e.bio||''}</p></div></article>`;document.getElementById('active').innerHTML=edited.filter(e=>e.status!=='Former').map(card).join('')||'<p>No active profiles published.</p>';document.getElementById('former').innerHTML=edited.filter(e=>e.status==='Former').map(card).join('')||'<p>No former profiles published.</p>'}catch(e){}})()</script>
<style>.team-grid{display:flex;flex-direction:column;gap:22px}.profile{display:flex;align-items:flex-start;gap:26px;padding:24px}.profile img{width:190px;height:190px;flex:0 0 190px;margin:0}.profile:nth-child(even){flex-direction:row-reverse}.profile h3{font-size:1.35rem}.profile p{font-size:1rem;line-height:1.7}@media(max-width:650px){.profile,.profile:nth-child(even){flex-direction:column}.profile img{width:140px;height:140px;flex-basis:140px}}</style>
